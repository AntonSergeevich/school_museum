# Сайт музея — боевой вариант с HTTPS. Собирается render_nginx из deploy/lib.sh.
map $request_method $museum_post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $museum_post_key zone=museum_post:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name __NAMES__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /internal/deploy-webhook {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
    }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    # «listen … ssl http2» понимают все версии. Отдельная директива «http2 on;»
    # есть только с nginx 1.25.1: в Ubuntu 24.04 (1.24) с ней конфиг не проходит
    # nginx -t. render_nginx сам заменяет строку на новую форму, если nginx
    # новее (Ubuntu 26.04 — 1.28), чтобы не было предупреждения deprecated.
    listen 443 ssl http2 default_server;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Только TLS 1.2 — ВРЕМЕННО, пока действуют правила фильтрации ТСПУ:
    # приветствие TLS 1.3 не помещается в один пакет, продолжение по дороге
    # отбрасывается, и сайт у части посетителей «не открывается».
    # Файл /etc/letsencrypt/options-ssl-nginx.conf СОЗНАТЕЛЬНО не подключаем:
    # ssl_protocols — набор флагов, и строка после include не отключает
    # TLSv1.3, а добавляется к нему. После смены протоколов нужен restart, не reload.
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:museum_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    if ($host = www.__DOMAIN__) { return 301 https://__DOMAIN__$request_uri; }

    include __ROOT__/deploy/nginx-common.inc;
}
