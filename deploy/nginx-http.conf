# Сайт музея — вариант без сертификата (домен ещё не выбран или DNS не готов).
# Собирается render_nginx из deploy/lib.sh и кладётся в /etc/nginx/sites-available/museum.
#
# map и limit_req_zone живут в контексте http — файл из sites-enabled
# подключается именно туда. Ключ пустой для всего, кроме POST: пустые
# ключи nginx не считает, значит лимит действует только на отправку форм.
map $request_method $museum_post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $museum_post_key zone=museum_post:10m rate=10r/m;

server {
    # Без «listen [::]:80»: если на сервере выключен IPv6, эта строка роняет nginx целиком.
    listen 80 default_server;
    server_name __NAMES__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    include __ROOT__/deploy/nginx-common.inc;
}
